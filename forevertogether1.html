function fmtT(t){return t?new Date("2000-01-01T"+t).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):""}

${d.story?`<div class="sec story"><h2>Our story</h2><div class="orn"><i></i></div>${d.story.split(/\n+/).map(x=>`<p>${esc(x)}</p>`).join("")}</div>`:""}
